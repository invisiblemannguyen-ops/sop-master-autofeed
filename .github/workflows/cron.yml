name: SOP Master Auto Pipeline 24/7

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  auto-run:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v3

      - name: Cài đặt Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cài đặt thư viện đầy đủ
        run: pip install requests beautifulsoup4

      - name: Chạy Script tự động
        run: python script.py
