name: SOP Master Auto Pipeline 24/7

on:
  schedule:
    - cron: '0 * * * *'  # Chạy tự động ngầm 1 tiếng / 1 lần
  workflow_dispatch:      # Kích hoạt thủ công qua nút bấm

jobs:
  auto-run:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests supabase || true

      - name: Run Data Ingestion Pipeline
        run: |
          python sop_master_ingest_pipeline.py
