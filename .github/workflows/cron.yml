name: SOP Master Auto Pipeline 24/7

on:
  schedule:
    - cron: '0 * * * *'  # Tự động cào ngầm 1 tiếng / 1 lần
  workflow_dispatch:      # Nút bấm kích hoạt thủ công

jobs:
  auto-run:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Data Ingestion Pipeline
        run: |
          python sop_master_ingest_pipeline.py
